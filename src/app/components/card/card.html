<mat-card
  #cardElement
  class="card"
  (click)="animateCard()"
  (mouseenter)="onMouseEnter()"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
>
  <div class="card-image">
    <p>{{ imageUrl }}</p>
  </div>

  <div class="card-content">
    <p>{{ text }}</p>
  </div>
</mat-card>
